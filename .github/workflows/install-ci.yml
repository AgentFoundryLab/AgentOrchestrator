# Install CI — WO-091: CI guardrail for runtime/path drift and install smoke tests.
#
# Triggers on any push or PR that modifies the distributed package or its tests.
# Three jobs:
#   drift-check   — validates registry paths vs package layout (no writes)
#   smoke-tests   — runs all install smoke, conformance, restore, and idempotency tests
#   vocabulary    — fails the build if pre-migration vocabulary re-enters a surface
#
# All jobs run in an isolated environment; no real ~/.claude/ or peer dirs are touched.

name: Install CI

on:
  push:
    paths:
      - 'install.sh'
      - 'package/**'
      - 'tests/**'
      - '.github/workflows/install-ci.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'package/**'
      - 'tests/**'
      - '.github/workflows/install-ci.yml'

jobs:
  # ---------------------------------------------------------------------------
  # drift-check: validate that registry paths match package layout
  # Fails with non-zero exit if any runtime path deviates from the canonical
  # registry declared in package/install/runtimes.sh.
  # ---------------------------------------------------------------------------
  drift-check:
    name: Runtime Path Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runtime path drift
        run: bash install.sh --check

  # ---------------------------------------------------------------------------
  # smoke-tests: run all install tests (WO-087..WO-090) in isolated temp HOME
  #
  # ISS-008: the matrix is the portability gate, not redundancy. A single
  # ubuntu-latest leg pairs GNU sed with mawk, and both accept GNU-only
  # constructs that BSD sed and BWK awk reject — so a one-leg gate reports
  # portability it never measured. Each leg below breaks a different assumption:
  #   ubuntu + mawk        — the baseline CI toolchain
  #   ubuntu + original-awk — BWK awk, which rejects a newline in `awk -v`
  #   ubuntu + gawk        — GNU awk, to catch gawk-only syntax
  #   macos                — BSD sed, which requires -i's backup suffix
  # Keep at least one non-GNU sed leg and one non-mawk awk leg.
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: Install Smoke & Conformance Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu / mawk
            awk: mawk
          - os: ubuntu-latest
            label: ubuntu / original-awk
            awk: original-awk
          - os: ubuntu-latest
            label: ubuntu / gawk
            awk: gawk
          - os: macos-latest
            label: macos / bsd
            awk: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # macOS ships bash 3.2; the installer needs 4+ for associative arrays.
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Select system awk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${{ matrix.awk }}"
          sudo update-alternatives --set awk "/usr/bin/${{ matrix.awk }}"
          echo "awk is now: $(readlink -f "$(command -v awk)")"

      - name: Run install smoke tests
        run: bash tests/install/smoke.sh

  # ---------------------------------------------------------------------------
  # vocabulary: guard the package against pre-migration vocabulary regressions.
  # Covers retired identifiers and — separately — retired concepts, which carry
  # no retired token and are invisible to an identifier sweep.
  # ---------------------------------------------------------------------------
  vocabulary:
    name: Package Vocabulary Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package vocabulary
        run: bash tests/package/vocabulary.sh
